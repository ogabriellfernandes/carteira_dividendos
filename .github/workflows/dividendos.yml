name: Buscar Dividendos

on:
  schedule:
    # Executa todo dia às 12:00 (horário de Brasília = UTC-3 -> 12:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch: {}  # permite rodar manualmente na aba Actions

jobs:
  buscar-dividendos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar service_account.json a partir do Secret
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Executar script de dividendos
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python buscarDividendos.py
